<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Soccer Analyst</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h1 { text-align: center; color: #22c55e; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border-left: 6px solid #22c55e; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .match { font-size: 1.25rem; font-weight: bold; margin-bottom: 10px; }
        .pick { color: #f59e0b; white-space: pre-wrap; margin: 10px 0; }
        .sugerencia { color: #38bdf8; font-style: italic; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Análisis de Fútbol</h1>
        <p style="text-align: center;">Resultados de hoy y mañana ({{ hoy }} / {{ manana }})</p>
        <hr>
        {% for res in resultados %}
        <div class="card">
            <div class="match">{{ res.match }}</div>
            <div class="pick"><strong>Pronóstico:</strong><br>{{ res.pick }}</div>
            {% if res.sugerencia %}
            <div class="sugerencia">💡 {{ res.sugerencia }}</div>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
