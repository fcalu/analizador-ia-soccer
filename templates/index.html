<!DOCTYPE html>
<html>
<head>
    <title>IA Betting Center - Live</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        .card { background: #1e293b; border-radius: 10px; padding: 15px; margin-bottom: 10px; border-left: 5px solid #3b82f6; }
        .loading { color: #64748b; font-style: italic; font-size: 0.8em; }
        .pick-box { color: #facc15; font-weight: bold; margin-top: 10px; }
        .badge { background: #334155; padding: 2px 8px; border-radius: 5px; font-size: 0.7em; }
    </style>
</head>
<body>
    <h1>🚀 IA Betting Center</h1>
    
    <h2>⚽ Fútbol</h2>
    <div id="soccer-container">
        {% for m in soccer %}
        <div class="card" id="match-{{ m.event_id }}">
            <div><strong>{{ m.home }} vs {{ m.away }}</strong></div>
            <div class="loading">🤖 IA analizando...</div>
        </div>
        <script>
            fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sport: 'soccer', league: '{{m.league}}', event_id: '{{m.event_id}}',
                    home_team: '{{m.home}}', away_team: '{{m.away}}'
                })
            })
            .then(response => response.json())
            .then(data => {
                const div = document.getElementById('match-{{ m.event_id }}');
                if(data.error) {
                    div.innerHTML += '<div style="color:red">Error en análisis</div>';
                } else {
                    div.innerHTML = `<div><strong>${data.match}</strong> <span class="badge">${data.team_confidence?.moneyline || ''}% Conf.</span></div>
                                     <div style="font-size:0.8em; color:#94a3b8; margin:5px 0;">${data.tipster_picks}</div>
                                     <div class="pick-box">✨ Pick: ${data.analysis.split('\\n').find(l => l.includes('Pick')) || 'Ver detalle'}</div>`;
                }
            });
        </script>
        {% endfor %}
    </div>

    <h2>🏀 NBA</h2>
    <div id="nba-container">
        {% for b in nba %}
        <div class="card" style="border-left-color: #f59e0b;" id="match-{{ b.event_id }}">
            <div><strong>{{ b.home }} vs {{ b.away }}</strong></div>
            <div class="loading">🤖 IA analizando...</div>
        </div>
        <script>
            fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sport: 'nba', league: '{{b.league}}', event_id: '{{b.event_id}}',
                    home_team: '{{b.home}}', away_team: '{{b.away}}'
                })
            })
            .then(response => response.json())
            .then(data => {
                const div = document.getElementById('match-{{ b.event_id }}');
                div.innerHTML = `<div><strong>${data.match}</strong></div><div class="pick-box">🔥 ${data.tipster_picks}</div>`;
            });
        </script>
        {% endfor %}
    </div>
</body>
</html>
